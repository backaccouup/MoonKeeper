name: MoonKeeper CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

env:
  MOONBIT_INSTALL_VERSION: 1.0.0-rc1+3c0520448

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install the pinned MoonBit toolchain
        run: |
          curl -fsSL --retry 3 https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/install-moonbit.sh"
          bash "$RUNNER_TEMP/install-moonbit.sh" "$MOONBIT_INSTALL_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Check and test portable codecs and native client
        run: |
          moon version --all
          moonc -v | grep -F "v${MOONBIT_INSTALL_VERSION}"
          moon update
          moon fmt --check
          moon check --target all --deny-warn
          moon build --target all --deny-warn
          moon test --target all --deny-warn
      - name: Install pinned interoperability client
        run: python3 -m pip install -r integration/requirements.txt
      - name: Test against ZooKeeper 3.9.3
        run: bash scripts/integration.sh single
      - name: Three-node failover and session expiry
        run: python3 integration/cluster.py --backend docker

  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned MoonBit
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'install-moonbit.ps1'
          Invoke-WebRequest https://cli.moonbitlang.com/install/powershell.ps1 -OutFile $installer
          & $installer
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build and test the native client
        run: |
          moon version --all
          if (((moonc -v) -join ' ') -notlike "*v$env:MOONBIT_INSTALL_VERSION*") { throw 'Unexpected moonc version' }
          moon update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          moon build --target native --deny-warn
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          moon test --target native --deny-warn
